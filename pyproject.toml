[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-weaver"
version = "0.1.0"
description = "AI-powered resume generation system with knowledge base and custom RAG"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Bhavin Ingle"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pydantic>=2.0",
    "instructor>=1.0",
    "openai>=1.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "rendercv>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.0",
    "ruff>=0.4",
]

[project.scripts]
cv-weaver = "cv_weaver.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_weaver"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q"
